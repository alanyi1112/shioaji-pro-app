schema: spec-driven
context: |
  語言：繁體中文（台灣）
  所有 OpenSpec 相關專案內容、proposal、design、spec、tasks、說明文件，必須使用繁體中文撰寫，並採用台灣常用語氣與用詞。

  技術名詞、程式碼、API 名稱、檔案路徑、套件名稱、指令、錯誤訊息可保留英文。
  正式股票資料來源必須確認實際欄位、資料日期、授權、自動化限制與市場覆蓋，不得用假資料或推測冒充正式行情。
  預設使用 Shioaji simulation 模式；未經使用者明確要求與完整驗證，不得啟用 production 或真實下單。
  自訂指標 JavaScript 不是完整安全沙箱，不得載入來源不明的程式碼。
  禁止將帳號、密碼、金鑰等機密資料寫入規格、任務或交給外部 AI Agent；必要時以 [REDACTED_SECRET] 表示。
