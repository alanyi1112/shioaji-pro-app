name: Cloudflare TDCC continuous backfill

on:
  schedule:
    - cron: "30 14 * * 6,0"
  workflow_dispatch:

concurrency:
  group: cloudflare-tdcc-continuous-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      TDCC_CONTINUOUS_BACKFILL_SECRET: ${{ secrets.CLOUDFLARE_TDCC_CONTINUOUS_BACKFILL_SECRET }}
      TDCC_HISTORY_INGEST_SECRET: ${{ secrets.CLOUDFLARE_TDCC_HISTORY_INGEST_SECRET }}
      TDCC_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'workflow_dispatch' }}
      CHIP_BACKFILL_SCOPE: tdcc-weekly
      SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
      RUN_ID: cloudflare-tdcc-gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify protected configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCESS_CLIENT_ID"
          test -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET"
          test -n "$TDCC_CONTINUOUS_BACKFILL_SECRET"
          test -n "$TDCC_HISTORY_INGEST_SECRET"
          test -n "$SITE_URL"
      - name: Wake Cloudflare chip backfill orchestrator
        id: orchestrator
        shell: bash
        run: |
          set -euo pipefail
          failure_reason="invalid_response"
          needs_cleanup="true"
          response=""

          request() {
            local action="$1"
            local reason="${2:-}"
            local payload
            payload="$(jq -cn \
              --arg action "$action" \
              --arg runId "$RUN_ID" \
              --arg trigger "$TDCC_TRIGGER" \
              --arg scope "$CHIP_BACKFILL_SCOPE" \
              --arg reason "$reason" \
              '{action:$action,runId:$runId,trigger:$trigger,scope:$scope} + if $reason == "" then {} else {reason:$reason} end')"
            curl --fail --silent --show-error --max-time 90 \
              -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
              -H "X-MultiChart-Pipeline-Authorization: Bearer $TDCC_CONTINUOUS_BACKFILL_SECRET" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$SITE_URL/api/internal/tdcc-continuous-backfill"
          }

          validate_response() {
            jq -e '
              .ok == true
              and ((.done | type) == "boolean")
              and ((.summary | type) == "object")
              and (.summary.scope == "tdcc-weekly")
              and (.summary.status | IN("running", "completed", "failed"))
              and (.summary.phase | IN("latest", "completed", "failed"))
              and (.summary.processedSymbols | type == "number" and . >= 0 and floor == .)
              and (.summary.remainingSymbols | type == "number" and . >= 0 and floor == .)
              and (.summary.pendingSymbols | type == "number" and . >= 0 and floor == .)
              and (.summary.reason == null or (.summary.reason | IN("source_not_published", "rate_limited", "provider_unavailable", "timeout", "invalid_response", "tick_limit_exceeded")))
              and (.recovery == null or (.recovery.status | IN("not_needed", "retry_waiting", "failed")))
            ' >/dev/null <<<"$1"
          }

          print_summary() {
            jq -r --arg tick "$2" '
              "cloudflare-chip-orchestrator tick=\($tick) scope=\(.summary.scope) status=\(.summary.status) phase=\(.summary.phase) processed=\(.summary.processedSymbols) remaining=\(.summary.remainingSymbols) pending=\(.summary.pendingSymbols) reason=\(.summary.reason // "none") recovery=\(.recovery.status // "none")"
            ' <<<"$1"
          }

          call_orchestrator() {
            local action="$1"
            local tick="$2"
            local curl_status
            if response="$(request "$action")"; then
              if ! validate_response "$response"; then
                failure_reason="invalid_response"
                return 1
              fi
              print_summary "$response" "$tick"
              return 0
            else
              curl_status=$?
              if [ "$curl_status" -eq 28 ]; then failure_reason="timeout"; else failure_reason="provider_unavailable"; fi
              return 1
            fi
          }

          finalize_failure() {
            local exit_status=$?
            local cleanup_response
            trap - EXIT
            if [ "$needs_cleanup" = "true" ]; then
              if cleanup_response="$(request orchestrator-fail "$failure_reason")" && validate_response "$cleanup_response"; then
                print_summary "$cleanup_response" "finalize"
              else
                echo "cloudflare-chip-orchestrator tick=finalize status=cleanup_failed reason=$failure_reason"
              fi
            fi
            exit "$exit_status"
          }
          trap finalize_failure EXIT

          if ! call_orchestrator orchestrator-start start; then exit 1; fi
          done_state="$(jq -r '.done' <<<"$response")"
          tick=0
          while [ "$done_state" != "true" ] && [ "$tick" -lt 60 ]; do
            tick=$((tick + 1))
            if ! call_orchestrator orchestrator-tick "$tick"; then exit 1; fi
            done_state="$(jq -r '.done' <<<"$response")"
          done
          if [ "$done_state" != "true" ]; then failure_reason="tick_limit_exceeded"; exit 1; fi
          needs_cleanup="false"
          trap - EXIT
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run bounded TDCC historical source adapter
        run: npm run tdcc:continuous -- --history-only --site-url="$SITE_URL" --trigger="$TDCC_TRIGGER" --run-id="$RUN_ID" --max-run-ms=1200000
      - name: Verify protected health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 60 \
            -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
            "$SITE_URL/api/health")"
          if ! jq -e --arg sha "$GITHUB_SHA" --arg run "$RUN_ID" --arg trigger "$TDCC_TRIGGER" '
            .ok == true
            and .deploymentTarget == "cloudflare"
            and .commitSha == $sha
            and .persistence.d1 == true
            and .taiwanStockChip.shareholderDistributionContinuous.configured == true
            and .taiwanStockChip.shareholderDistributionContinuous.lastRunId == $run
            and .taiwanStockChip.shareholderDistributionContinuous.lastRunTrigger == $trigger
            and .taiwanStockChip.shareholderDistributionContinuous.lastRunStatus == "completed"
            and ((.taiwanStockChip.shareholderDistributionContinuous.lastHeartbeatAt | type) == "string")
          ' <<<"$response" >/dev/null; then
            echo "cloudflare-tdcc-health status=contract_failed"
            exit 1
          fi
          jq -r '
            "cloudflare-tdcc-health status=healthy target=cloudflare d1=true runId=\(.taiwanStockChip.shareholderDistributionContinuous.lastRunId) trigger=\(.taiwanStockChip.shareholderDistributionContinuous.lastRunTrigger) runStatus=\(.taiwanStockChip.shareholderDistributionContinuous.lastRunStatus) heartbeat=\(.taiwanStockChip.shareholderDistributionContinuous.lastHeartbeatAt) tdccStatus=\(.taiwanStockChip.shareholderDistributionContinuous.status) dataDate=\(.taiwanStockChip.shareholderDistributionContinuous.latestDataDate // "none") targetSymbols=\(.taiwanStockChip.shareholderDistributionContinuous.targetSymbols) queuedSymbols=\(.taiwanStockChip.shareholderDistributionContinuous.queuedSymbols) runningSymbols=\(.taiwanStockChip.shareholderDistributionContinuous.runningSymbols) completedSymbols=\(.taiwanStockChip.shareholderDistributionContinuous.completedSymbols) blockedSymbols=\(.taiwanStockChip.shareholderDistributionContinuous.blockedSymbols)"
          ' <<<"$response"
