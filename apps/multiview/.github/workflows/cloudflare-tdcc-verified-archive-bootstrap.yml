name: Cloudflare TDCC verified archive bootstrap

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-tdcc-verified-archive-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    env:
      SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      TDCC_ARCHIVE_SECRET: ${{ secrets.CLOUDFLARE_TDCC_CONTINUOUS_BACKFILL_SECRET }}
      MANIFEST_VERSION: tdcc-archive-2026-v1
      ARCHIVE_SCOPE: full-market
      OWNER: cloudflare-archive-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout fixed release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify protected exact release
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          test -n "$CLOUDFLARE_ACCESS_CLIENT_ID"
          test -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET"
          test -n "$TDCC_ARCHIVE_SECRET"
          response="$(curl --fail --silent --show-error --max-time 60 \
            -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
            "$SITE_URL/api/health")"
          jq -e --arg sha "$GITHUB_SHA" '
            .ok == true
            and .deploymentTarget == "cloudflare"
            and .commitSha == $sha
            and .persistence.d1 == true
          ' <<<"$response" >/dev/null
      - name: Seed fixed verified archive manifest
        shell: bash
        run: |
          set -euo pipefail
          MULTIVIEW_ARCHIVE_TARGET_URL="$SITE_URL" TDCC_ARCHIVE_OWNER="$OWNER" TDCC_CONTINUOUS_BACKFILL_SECRET="$TDCC_ARCHIVE_SECRET" \
            node scripts/tdcc-archive-bootstrap.mjs
      - name: Verify protected archive health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 60 \
            -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
            "$SITE_URL/api/health")"
          jq -e --arg sha "$GITHUB_SHA" --arg manifest "$MANIFEST_VERSION" '
            .ok == true
            and .deploymentTarget == "cloudflare"
            and .commitSha == $sha
            and .taiwanStockChip.archive.manifestVersion == $manifest
            and .taiwanStockChip.archive.complete == true
            and .taiwanStockChip.archive.remaining == 0
            and .taiwanStockChip.archive.failed == 0
            and .taiwanStockChip.archive.overdue == 0
          ' <<<"$response" >/dev/null
          jq -r '"tdcc-archive-health target=cloudflare complete=\(.taiwanStockChip.archive.complete) processed=\(.taiwanStockChip.archive.processed) remaining=\(.taiwanStockChip.archive.remaining) failed=\(.taiwanStockChip.archive.failed) overdue=\(.taiwanStockChip.archive.overdue)"' <<<"$response"
