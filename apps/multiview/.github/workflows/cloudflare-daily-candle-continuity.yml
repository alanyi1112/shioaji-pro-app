name: Cloudflare daily candle continuity

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-daily-candle-continuity
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_CANDLE_CONTINUITY_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
      DEPLOYMENT_TARGET: cloudflare
      RUN_ID: cloudflare-gha-${{ github.run_id }}-${{ github.run_attempt }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      CANDLE_CONTINUITY_AUDIT_SECRET: ${{ secrets.CLOUDFLARE_CANDLE_CONTINUITY_AUDIT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify protected configuration
        shell: bash
        run: |
          test -n "$SITE_URL"
          test -n "$CLOUDFLARE_ACCESS_CLIENT_ID"
          test -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET"
          test -n "$CANDLE_CONTINUITY_AUDIT_SECRET"
      - name: Run durable continuity audit
        run: node scripts/candle-continuity-runner.mjs
      - name: Verify representative candle evidence
        run: node scripts/verify-daily-candle-continuity.mjs
