name: TDCC verified archive bootstrap

on:
  workflow_dispatch:

concurrency:
  group: tdcc-verified-archive-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://quote-chart-multiview.alanyi1112.chatgpt.site
      SITES_BYPASS_TOKEN: ${{ secrets.SITES_BYPASS_TOKEN }}
      TDCC_ARCHIVE_SECRET: ${{ secrets.TDCC_CONTINUOUS_BACKFILL_SECRET }}
      MANIFEST_VERSION: tdcc-archive-2026-v1
      ARCHIVE_SCOPE: full-market
      OWNER: sites-archive-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify protected exact release
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SITES_BYPASS_TOKEN"
          test -n "$TDCC_ARCHIVE_SECRET"
          response="$(curl --fail --silent --show-error --max-time 60 \
            -H "OAI-Sites-Authorization: Bearer $SITES_BYPASS_TOKEN" \
            "$SITE_URL/api/health")"
          jq -e --arg sha "$GITHUB_SHA" '
            .ok == true
            and .deploymentTarget == "sites"
            and .commitSha == $sha
            and .persistence.d1 == true
          ' <<<"$response" >/dev/null
      - name: Seed fixed verified archive manifest
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$SITE_URL/api/internal/tdcc-archive-bootstrap"
          dates=(2026-04-30 2026-05-08 2026-05-15 2026-05-22 2026-05-29 2026-06-05 2026-06-12 2026-06-18 2026-06-26 2026-07-03 2026-07-09 2026-07-17 2026-07-24 2026-07-31 2026-08-07 2026-08-14 2026-08-21 2026-08-28)

          request() {
            local action="$1"
            local date="${2:-}"
            local payload
            payload="$(jq -cn --arg action "$action" --arg owner "$OWNER" --arg manifestVersion "$MANIFEST_VERSION" --arg scope "$ARCHIVE_SCOPE" --arg date "$date" '
              {action:$action,owner:$owner,manifestVersion:$manifestVersion,scope:$scope}
              + if $date == "" then {} else {date:$date} end')"
            curl --fail --silent --show-error --max-time 120 \
              -H "OAI-Sites-Authorization: Bearer $SITES_BYPASS_TOKEN" \
              -H "Authorization: Bearer $TDCC_ARCHIVE_SECRET" \
              -H "Content-Type: application/json" \
              --data "$payload" "$endpoint"
          }

          validate_summary() {
            jq -e --arg manifest "$MANIFEST_VERSION" --arg sha "$GITHUB_SHA" '
              .ok == true
              and .archive.manifestVersion == $manifest
              and .archive.target == 18
              and (.archive.processed | type == "number" and . >= 0 and floor == .)
              and (.archive.remaining | type == "number" and . >= 0 and floor == .)
              and (.archive.failed | type == "number" and . >= 0 and floor == .)
              and (.archive.overdue | type == "number" and . >= 0 and floor == .)
              and .archive.commitSha == "17944774a7a37c8ef52a7ca919817fe6f949891c"
            ' >/dev/null <<<"$1"
          }

          response="$(request start)"
          validate_summary "$response"
          for date in "${dates[@]}"; do
            response="$(request prepare-period "$date")"
            validate_summary "$response"
            jq -r --arg date "$date" '"tdcc-archive target=sites date=\($date) status=\(.receipt.status) processed=\(.archive.processed) remaining=\(.archive.remaining) failed=\(.archive.failed) overdue=\(.archive.overdue)"' <<<"$response"
          done
          response="$(request finalize)"
          validate_summary "$response"
          jq -e '.archive.complete == true and .archive.processed == 18 and .archive.remaining == 0 and .archive.failed == 0 and .archive.overdue == 0' <<<"$response" >/dev/null
          jq -r '"tdcc-archive target=sites status=complete processed=\(.archive.processed) remaining=\(.archive.remaining) failed=\(.archive.failed) overdue=\(.archive.overdue)"' <<<"$response"
      - name: Verify protected archive health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 60 \
            -H "OAI-Sites-Authorization: Bearer $SITES_BYPASS_TOKEN" \
            "$SITE_URL/api/health")"
          jq -e --arg sha "$GITHUB_SHA" --arg manifest "$MANIFEST_VERSION" '
            .ok == true
            and .deploymentTarget == "sites"
            and .commitSha == $sha
            and .taiwanStockChip.archive.manifestVersion == $manifest
            and .taiwanStockChip.archive.complete == true
            and .taiwanStockChip.archive.remaining == 0
            and .taiwanStockChip.archive.failed == 0
            and .taiwanStockChip.archive.overdue == 0
          ' <<<"$response" >/dev/null
          jq -r '"tdcc-archive-health target=sites complete=\(.taiwanStockChip.archive.complete) processed=\(.taiwanStockChip.archive.processed) remaining=\(.taiwanStockChip.archive.remaining) failed=\(.taiwanStockChip.archive.failed) overdue=\(.taiwanStockChip.archive.overdue)"' <<<"$response"
