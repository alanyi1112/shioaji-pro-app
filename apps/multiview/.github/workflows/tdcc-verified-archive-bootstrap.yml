name: TDCC verified archive bootstrap

on:
  workflow_dispatch:

concurrency:
  group: tdcc-verified-archive-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://quote-chart-multiview.alanyi1112.chatgpt.site
      SITES_BYPASS_TOKEN: ${{ secrets.SITES_BYPASS_TOKEN }}
      TDCC_ARCHIVE_SECRET: ${{ secrets.TDCC_CONTINUOUS_BACKFILL_SECRET }}
      MANIFEST_VERSION: tdcc-archive-2026-v1
      ARCHIVE_SCOPE: full-market
      OWNER: sites-archive-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify protected exact release
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SITES_BYPASS_TOKEN"
          test -n "$TDCC_ARCHIVE_SECRET"
          response="$(curl --fail --silent --show-error --max-time 60 \
            -H "OAI-Sites-Authorization: Bearer $SITES_BYPASS_TOKEN" \
            "$SITE_URL/api/health")"
          jq -e --arg sha "$GITHUB_SHA" '
            .ok == true
            and .deploymentTarget == "codex-sites"
            and .commitSha == $sha
            and .persistence.d1 == true
          ' <<<"$response" >/dev/null
      - name: Seed fixed verified archive manifest
        shell: bash
        run: |
          set -euo pipefail
          MULTIVIEW_ARCHIVE_TARGET_URL="$SITE_URL" TDCC_ARCHIVE_OWNER="$OWNER" TDCC_CONTINUOUS_BACKFILL_SECRET="$TDCC_ARCHIVE_SECRET" \
            node scripts/tdcc-archive-bootstrap.mjs
      - name: Verify protected archive health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 60 \
            -H "OAI-Sites-Authorization: Bearer $SITES_BYPASS_TOKEN" \
            "$SITE_URL/api/health")"
          jq -e --arg sha "$GITHUB_SHA" --arg manifest "$MANIFEST_VERSION" '
            .ok == true
            and .deploymentTarget == "codex-sites"
            and .commitSha == $sha
            and .taiwanStockChip.archive.manifestVersion == $manifest
            and .taiwanStockChip.archive.complete == true
            and .taiwanStockChip.archive.remaining == 0
            and .taiwanStockChip.archive.failed == 0
            and .taiwanStockChip.archive.overdue == 0
          ' <<<"$response" >/dev/null
          jq -r '"tdcc-archive-health target=sites complete=\(.taiwanStockChip.archive.complete) processed=\(.taiwanStockChip.archive.processed) remaining=\(.taiwanStockChip.archive.remaining) failed=\(.taiwanStockChip.archive.failed) overdue=\(.taiwanStockChip.archive.overdue)"' <<<"$response"
