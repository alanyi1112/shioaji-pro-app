# Open-source build guarantee: the public repo's web app must always build
# WITHOUT the private desktop modules — anyone cloning this repo gets a
# working web terminal (closed features show their FeatureGate lock screens).
name: web-build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TZ: Asia/Taipei

jobs:
  unit-tests:
    name: Unit tests (macOS runtime)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runtime contract fixtures inspect the public build and macOS tools.
      - name: Build public artifacts for runtime fixtures
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify MultiView source governance
        run: pnpm verify:multiview-governance

      - name: Test imported MultiView
        run: pnpm test:multiview

      # no private modules checkout on purpose — this is the OSS path
      - name: Build web app (stub modules)
        run: pnpm build

      - name: Assert stub was used
        run: |
          test ! -d modules && echo "OK: built without private modules"
